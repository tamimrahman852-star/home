<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Roboto, arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    a {
      text-decoration: none;
      color: rgba(0,0,0,0.87);
    }

    a:hover {
      text-decoration: underline;
    }

    /* Top Navigation Bar */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 20px;
      gap: 15px;
      font-size: 13px;
    }

    .header-link {
      color: rgba(0,0,0,0.87);
    }

    .apps-icon {
      color: #5f6368;
      font-size: 20px;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .apps-icon:hover {
      background-color: rgba(60,64,67,0.08);
    }

    .profile-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid #dadce0;
    }

    /* Main Section */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 20px;
      margin-top: -80px;
    }

    /* Google Style Colored Logo for Tamim Rahman */
    .logo-container {
      font-size: 5rem;
      font-weight: 500;
      letter-spacing: -2px;
      margin-bottom: 25px;
      user-select: none;
    }

    .c-blue   { color: #4285f4; }
    .c-red    { color: #ea4335; }
    .c-yellow { color: #fbbc05; }
    .c-green  { color: #34a853; }

    /* Google Search Box */
    .search-container {
      width: 100%;
      max-width: 584px;
    }

    .search-box {
      width: 100%;
      height: 46px;
      background: #ffffff;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .search-box:hover {
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
      border-color: rgba(223,225,229,0);
    }

    .search-box:focus-within {
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
      border-color: rgba(223,225,229,0);
    }

    .search-icon {
      color: #9aa0a6;
      font-size: 14px;
      margin-right: 13px;
    }

    .search-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: rgba(0,0,0,0.87);
      font-size: 16px;
    }

    .voice-search {
      color: #4285f4;
      font-size: 16px;
      cursor: pointer;
      padding: 0 8px;
    }

    /* Search Buttons */
    .buttons-container {
      margin-top: 28px;
      display: flex;
      gap: 12px;
    }

    .btn {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-size: 14px;
      padding: 0 16px;
      height: 36px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
    }

    .btn:hover {
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      background-color: #f8f9fa;
      border: 1px solid #dadce0;
      color: #202124;
    }

    /* Languages Offered */
    .languages {
      margin-top: 28px;
      font-size: 13px;
      color: #4d5156;
    }

    .languages a {
      color: #1a0dab;
      margin-left: 5px;
    }

    /* Footer Section */
    footer {
      background: #f2f2f2;
      width: 100%;
      color: #70757a;
      font-size: 14px;
    }

    .footer-location {
      padding: 15px 30px;
      border-bottom: 1px solid #dadce0;
    }

    .footer-links {
      display: flex;
      justify-content: space-between;
      padding: 15px 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .footer-links-group {
      display: flex;
      gap: 30px;
    }

    .footer-links a {
      color: #70757a;
    }

    /* Responsive Adjustments */
    @media (max-width: 600px) {
      .logo-container { font-size: 3.2rem; }
      .footer-links {
        justify-content: center;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .footer-links-group {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <a href="https://mail.google.com" class="header-link">Gmail</a>
    <a href="https://www.google.com/imghp" class="header-link">Images</a>
    <div class="apps-icon" title="Google apps">
      <i class="fa-solid fa-grip-vertical"></i>
    </div>
    <img src="profile.JPG" alt="Tamim Rahman" class="profile-img" title="Tamim Rahman">
  </header>

  <!-- Main Content -->
  <main>
    <!-- Google Brand Color Styled "Tamim Rahman" Logo -->
    <div class="logo-container">
      <span class="c-blue">T</span><span class="c-red">a</span><span class="c-yellow">m</span><span class="c-blue">i</span><span class="c-green">m</span>
      <span style="margin-left: 10px;"></span>
      <span class="c-red">R</span><span class="c-yellow">a</span><span class="c-blue">h</span><span class="c-green">m</span><span class="c-red">a</span><span class="c-blue">n</span>
    </div>

    <!-- Search Form -->
    <div class="search-container">
      <form class="search-box" action="https://www.google.com/search" method="get">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input 
          type="text" 
          class="search-input" 
          name="q" 
          required 
          autocomplete="off"
          autofocus
        >
        <i class="fa-solid fa-microphone voice-search" title="Search by voice"></i>
      </form>
    </div>

    <!-- Search & Lucky Buttons -->
    <div class="buttons-container">
      <button class="btn" onclick="document.forms[0].submit();">Google Search</button>
      <button class="btn" type="button" onclick="window.location.href='https://www.google.com/doodles'">I'm Feeling Lucky</button>
    </div>

    <!-- Language Options -->
    <div class="languages">
      Google offered in: <a href="#">বাংলা</a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-location">
      Bangladesh
    </div>
    <div class="footer-links">
      <div class="footer-links-group">
        <a href="https://about.google/">About</a>
        <a href="https://ads.google.com?subid=xs-ip-gemini-adlc">Advertising</a>
        <a href="https://www.google.com/services/">Business</a>
        <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
      </div>
      <div class="footer-links-group">
        <a href="https://policies.google.com/privacy">Privacy</a>
        <a href="https://policies.google.com/terms">Terms</a>
        <a href="#">Settings</a>
      </div>
    </div>
  </footer>

</body>
</html>
